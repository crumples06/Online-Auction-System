{% extends 'base.html' %}
{% block content %}

<div class="container mt-5">
    <h2 class="mb-4">My Watchlist</h2>

    {% for item in watchlist_items %}
        <div class="card mb-3 shadow-sm">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="card-title mb-1">
                        <a href="{% url 'item' item.auction.id %}" class="text-decoration-none">
                            {{ item.auction.product.name }}
                        </a>
                    </h5>
                    <p class="mb-0 text-muted">Ends on: {{ item.auction.end_time|date:"M d, Y H:i" }}</p>
                </div>
                <a href="{% url 'remove_from_watchlist' item.auction.id %}" class="btn btn-outline-danger btn-sm">
                    Remove
                </a>
            </div>
        </div>
    {% empty %}
        <div class="alert alert-info">You have no items in your watchlist.</div>
    {% endfor %}
</div>

{% endblock %}
