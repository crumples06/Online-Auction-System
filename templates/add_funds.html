{% extends 'base.html' %}

{% block title %}Add Funds - BidBazaar{% endblock %}

{% block content %}
<div class="container">
    <div class="row mb-4">
        <div class="col">
            <h1 class="mb-0">Add Funds to Wallet</h1>
            <p class="text-muted">Add money to your wallet to bid on auctions.</p>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-6 mx-auto">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-4">
                            <label for="current-balance" class="form-label">Current Balance</label>
                            <div class="input-group">
                                <span class="input-group-text">₹</span>
                                <input type="text" class="form-control" id="current-balance" value="{{ wallet.balance }}" disabled>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label for="amount" class="form-label">Amount to Add</label>
                            <div class="input-group">
                                <span class="input-group-text">₹</span>
                                <input type="number" class="form-control" id="amount" name="amount" min="100" step="100" required>
                            </div>
                            <div class="form-text">Minimum amount: ₹100</div>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label">Quick Amounts</label>
                            <div class="d-flex flex-wrap gap-2">
                                <button type="button" class="btn btn-outline-primary quick-amount" data-amount="500">₹500</button>
                                <button type="button" class="btn btn-outline-primary quick-amount" data-amount="1000">₹1,000</button>
                                <button type="button" class="btn btn-outline-primary quick-amount" data-amount="2000">₹2,000</button>
                                <button type="button" class="btn btn-outline-primary quick-amount" data-amount="5000">₹5,000</button>
                            </div>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">Add Funds</button>
                            <a href="{% url 'wallet_dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Quick amount buttons
        const quickAmountButtons = document.querySelectorAll('.quick-amount');
        const amountInput = document.getElementById('amount');
        
        quickAmountButtons.forEach(button => {
            button.addEventListener('click', function() {
                const amount = this.getAttribute('data-amount');
                amountInput.value = amount;
            });
        });
    });
</script>
{% endblock %}
